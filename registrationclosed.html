<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Animated Swing Sign</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Butcherman&family=Megrim&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mystery+Quest&family=Nosifer&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Questrial&family=Rubik+Glitch&family=Sedgwick+Ave+Display&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: start;
            overflow: hidden;
            padding-top: 100px;
        }

        .container {
            position: relative;
            width: 300px;
            height: 200px;
        }

        .container::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            backdrop-filter: blur(1em) brightness(6);
            background-image: radial-gradient(circle at 50% 50%, #0000 0, #0000 2px, hsl(0 0% 4%) 2px);
            background-size: 8px 8px;
        }

        /* Decorative background animation */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(4px 100px at 0px 235px, #09f, #0000),
                radial-gradient(4px 100px at 300px 235px, #09f, #0000),
                radial-gradient(1.5px 1.5px at 150px 117.5px, #09f 100%, #0000 150%);
            background-size: 300px 300px;
            animation: hi 100s linear infinite;
            z-index: -2;
        }

        @keyframes hi {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 10000px;
            }
        }

        .nail {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .rope {
            width: 2px;
            height: 30px;
            background-color: #fff;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .sign {
            width: 300px;
            height: 150px;
            background-color: #ffa500;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 5px solid #fff;
            border-radius: 10px;
            position: relative;
            top: 30px;
            transform-origin: top center;
            animation: swing 1s ease-in-out infinite alternate;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes swing {
            0% {
                transform: rotate(-5deg);
            }

            100% {
                transform: rotate(5deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nail"></div>
        <div class="rope"></div>
        <div class="sign"><a href="index.html" style="text-decoration: none;color: #fff;">Registration Closed</a></div>
    </div>
</body>

</html>
